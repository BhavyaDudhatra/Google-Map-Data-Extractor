<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" role="img" aria-label="Blocked by Google, job pauses, user solves it, job resumes">
  <style>
    text { font-family: "Segoe UI", Roboto, Arial, sans-serif; }
    .ttl { fill: #202124; font-size: 14px; font-weight: 600; }
    .mut { fill: #5f6368; font-size: 11px; }
    .cap { fill: #80868b; font-size: 11px; }
    .lbl { fill: #5f6368; font-size: 11.5px; font-weight: 600; }
    @keyframes on {
      0%, 4% { opacity: 0; }
      8%, 22% { opacity: 1; }
      26%, 100% { opacity: 0; }
    }
    .on { opacity: 0; animation: on 6s ease-in-out infinite; }
  </style>
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3c4043" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="438" height="218" rx="16" fill="#ffffff" stroke="#e3e6ea" filter="url(#sh)"/>

  <text class="ttl" x="24" y="30">Captcha &#183; consent wall</text>
  <text class="mut" x="416" y="29" text-anchor="end">stopOnBlocked = true</text>

  <!-- stage 1: blocked -->
  <rect x="24" y="64" width="118" height="72" rx="14" fill="#f8f9fa" stroke="#eef0f2"/>
  <rect class="on" x="24" y="64" width="118" height="72" rx="14" fill="#fce8e6" stroke="#ea4335" style="animation-delay:.3s"/>
  <g transform="translate(73 76) scale(0.85)" fill="none" stroke="#ea4335" stroke-width="2.6" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/><path d="M7 17 17 7"/>
  </g>
  <text class="lbl" x="83" y="122" text-anchor="middle">blocked</text>

  <text x="152" y="106" text-anchor="middle" font-size="15" fill="#5f6368">&#8594;</text>

  <!-- stage 2: pause -->
  <rect x="161" y="64" width="118" height="72" rx="14" fill="#f8f9fa" stroke="#eef0f2"/>
  <rect class="on" x="161" y="64" width="118" height="72" rx="14" fill="#fef7e0" stroke="#f9ab00" style="animation-delay:1.9s"/>
  <path transform="translate(210 76) scale(0.85)" fill="#f9ab00" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
  <text class="lbl" x="220" y="122" text-anchor="middle">job pauses</text>

  <text x="289" y="106" text-anchor="middle" font-size="15" fill="#5f6368">&#8594;</text>

  <!-- stage 3: resume -->
  <rect x="298" y="64" width="118" height="72" rx="14" fill="#f8f9fa" stroke="#eef0f2"/>
  <rect class="on" x="298" y="64" width="118" height="72" rx="14" fill="#e6f4ea" stroke="#34a853" style="animation-delay:3.5s"/>
  <path transform="translate(347 76) scale(0.85)" fill="#34a853" d="M8 5v14l11-7z"/>
  <text class="lbl" x="357" y="122" text-anchor="middle">you resume</text>

  <text class="cap" x="220" y="176" text-anchor="middle">solve the check in the Maps tab, then press Resume &#8212; the queue is untouched</text>
</svg>
