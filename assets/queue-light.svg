<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Queue of up to 1000 named areas draining area by area, with progress bar and live counters">
  <style>
    text { font-family: "Google Sans", "Product Sans", Roboto, "Segoe UI", Arial, sans-serif; }
    .ttl { fill: #202124; font-size: 14px; font-weight: 600; }
    .mut { fill: #5f6368; font-size: 11px; }
    .num { fill: #1a73e8; font-size: 13px; font-weight: 700; }
    .lbl { fill: #5f6368; font-size: 10px; font-weight: 500; }
    .cnt { fill: #5f6368; font-size: 13px; font-weight: 600; }
    .pill { fill: #1a73e8; font-size: 10.5px; font-weight: 700; letter-spacing: .5px; }
    @keyframes sweep { 0% { transform: scaleX(0); } 90%, 100% { transform: scaleX(1); } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: sweep 6s linear infinite; }
    @keyframes work {
      0% { opacity: 0; }
      6%, 11% { opacity: 1; }
      16%, 100% { opacity: 0; }
    }
    .on { opacity: 0; animation: work 6s ease-out infinite; }
    @keyframes cnt {
      0% { opacity: 0; }
      2%, 23% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    .c { opacity: 0; animation: cnt 6s ease-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .dot { animation: blink 1.4s ease-in-out infinite; }
  </style>
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3c4043" flood-opacity="0.13"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="878" height="218" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="218" rx="16" fill="#ffffff" stroke="#e3e6ea" filter="url(#sh)"/>

  <g clip-path="url(#card)">
    <rect x="1"     y="1" width="220" height="4" fill="#4285f4"/>
    <rect x="221"   y="1" width="220" height="4" fill="#ea4335"/>
    <rect x="441"   y="1" width="220" height="4" fill="#f9ab00"/>
    <rect x="661"   y="1" width="218" height="4" fill="#34a853"/>
  </g>

  <text class="ttl" x="24" y="34">Area queue</text>
  <text class="mut" x="856" y="33" text-anchor="end">1000 areas in &#8594; spreadsheet out &#183; runs in the background</text>

  <rect x="24" y="50" width="832" height="8" rx="4" fill="#f1f3f4"/>
  <rect class="bar" x="24" y="50" width="832" height="8" rx="4" fill="#1a73e8"/>

  <g>
    <text class="num c" x="24"  y="78" style="animation-delay:0.00s">128</text>
    <text class="num c" x="24"  y="78" style="animation-delay:1.45s">410</text>
    <text class="num c" x="24"  y="78" style="animation-delay:2.90s">733</text>
    <text class="num c" x="24"  y="78" style="animation-delay:4.35s">1000</text>
  </g>
  <text class="mut" x="64" y="78">/ 1000 areas done</text>
  <text class="mut" x="856" y="78" text-anchor="end"><tspan fill="#b06000">18 skipped</tspan><tspan fill="#5f6368"> &#183; </tspan><tspan fill="#d93025">3 errors</tspan><tspan fill="#5f6368"> &#183; human-like delay</tspan></text>

  <g>
    <rect x="24" y="88" width="76" height="38" rx="10" fill="#f8f9fa" stroke="#eef0f2"/>
    <rect class="on" x="24" y="88" width="76" height="38" rx="10" fill="#e8f0fe" stroke="#1a73e8" style="animation-delay:0.15s"/>
