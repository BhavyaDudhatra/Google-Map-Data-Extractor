<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" role="img" aria-label="Google Maps result feed auto-scrolling as new cards load">
  <style>
    text { font-family: "Segoe UI", Roboto, Arial, sans-serif; }
    .ttl { fill: #202124; font-size: 14px; font-weight: 600; }
    .mut { fill: #5f6368; font-size: 11px; }
    .cap { fill: #80868b; font-size: 11px; }
    @keyframes rowIn {
      0% { opacity: 0; transform: translateY(12px); }
      12%, 82% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(12px); }
    }
    .row { animation: rowIn 6s ease-in-out infinite; }
    @keyframes down { 0% { transform: translateY(0); } 100% { transform: translateY(102px); } }
    .thumb { animation: down 6s ease-in-out infinite; }
  </style>
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3c4043" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="438" height="218" rx="16" fill="#ffffff" stroke="#e3e6ea" filter="url(#sh)"/>

  <path transform="translate(24 18) scale(0.8)" fill="#ea4335"
        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
  <text class="ttl" x="50" y="33">Maps results</text>
  <text class="mut" x="416" y="32" text-anchor="end">auto-scroll until no new cards</text>

  <g class="row" style="animation-delay:.00s">
    <rect x="24" y="52" width="376" height="32" rx="8" fill="#f8f9fa" stroke="#eef0f2"/>
    <circle cx="42" cy="68" r="5" fill="#4285f4"/>
    <rect x="56" y="61" width="112" height="7" rx="3.5" fill="#c9cdd2"/>
    <rect x="56" y="72" width="72" height="5" rx="2.5" fill="#e2e5e9"/>
    <text class="cap" x="384" y="72" text-anchor="end">4.8</text>
  </g>
  <g class="row" style="animation-delay:.50s">
    <rect x="24" y="90" width="376" height="32" rx="8" fill="#f8f9fa" stroke="#eef0f2"/>
    <circle cx="42" cy="106" r="5" fill="#ea4335"/>
    <rect x="56" y="99" width="138" height="7" rx="3.5" fill="#c9cdd2"/>
    <rect x="56" y="110" width="58" height="5" rx="2.5" fill="#e2e5e9"/>
    <text class="cap" x="384" y="110" text-anchor="end">4.6</text>
  </g>
  <g class="row" style="animation-delay:1.00s">
    <rect x="24" y="128" width="376" height="32" rx="8" fill="#f8f9fa" stroke="#eef0f2"/>
    <circle cx="42" cy="144" r="5" fill="#f9ab00"/>
    <rect x="56" y="137" width="96" height="7" rx="3.5" fill="#c9cdd2"/>
    <rect x="56" y="148" width="86" height="5" rx="2.5" fill="#e2e5e9"/>
    <text class="cap" x="384" y="148" text-anchor="end">4.9</text>
  </g>
  <g class="row" style="animation-delay:1.50s">
    <rect x="24" y="166" width="376" height="32" rx="8" fill="#f8f9fa" stroke="#eef0f2"/>
    <circle cx="42" cy="182" r="5" fill="#34a853"/>
    <rect x="56" y="175" width="124" height="7" rx="3.5" fill="#c9cdd2"/>
    <rect x="56" y="186" width="48" height="5" rx="2.5" fill="#e2e5e9"/>
    <text class="cap" x="384" y="186" text-anchor="end">4.7</text>
  </g>

  <rect x="410" y="52" width="8" height="146" rx="4" fill="#f1f3f4"/>
  <rect class="thumb" x="410" y="52" width="8" height="44" rx="4" fill="#c9cdd2"/>
</svg>
